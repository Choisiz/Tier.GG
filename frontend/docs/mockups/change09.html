function refreshBtn(state){

      <span class="relative block size-[72px] shrink-0">
        <span class="block size-full overflow-hidden rounded-lg">${ICON_IMG}</span>
        <span class="absolute -bottom-2 left-1/2 -translate-x-1/2 rounded-full border border-border bg-background px-2 py-0.5 text-[11px] font-semibold text-muted">Lv.312</span></span>
      <div class="min-w-0"><h1 class="truncate text-xl font-bold">너희는개다 <span class="font-normal text-muted">#KR1</span></h1>
        <p class="text-sm text-muted">KR</p></div>
    </div>
    ${tierLine(true)}
    <div class="flex items-center justify-between gap-3 border-t border-border pt-3">
      <span class="text-xs text-muted">${stamp}</span>${refreshBtn(state)}
    </div></section>`;
  return `<section class="flex items-center gap-5 rounded-lg border border-border bg-surface p-5">
    <span class="relative block size-24 shrink-0">
      <span class="block size-full overflow-hidden rounded-xl">${ICON_IMG}</span>
      <span class="absolute -bottom-2 left-1/2 -translate-x-1/2 rounded-full border border-border bg-background px-2.5 py-0.5 text-xs font-semibold text-muted">Lv.312</span></span>
    <div class="min-w-0 flex-1 space-y-2">
      <h1 class="text-2xl font-bold">너희는개다 <span class="font-normal text-muted">#KR1</span></h1>
      ${tierLine(false)}
    </div>
    <div class="flex shrink-0 flex-col items-end gap-1.5">
      ${refreshBtn(state)}
      <span class="text-xs text-muted">${stamp}${hint?` · ${hint}`:''}</span>
    </div></section>`;
}

/* ───── 랭크 카드 ───── */
function rankCard(label, body){ return `<div class="rounded-lg border border-border bg-surface p-4"><p class="mb-2 text-xs font-semibold text-muted">${label}</p>${body}</div>`; }
function ranked(tier, text, lp, w, l, wr){
  return `<div class="flex items-center gap-3"><img src="${EMB_DATA[tier]}" class="size-12 object-contain" alt="">
  <div><p class="font-bold">${text} <span class="font-normal text-muted">${lp}</span></p><p class="text-sm text-muted">${w}승 ${l}패 · ${wr}</p></div></div>`;
}
function unranked(msg){
  return `<div class="flex items-center gap-3"><div class="flex size-12 shrink-0 items-center justify-center rounded-full border border-dashed border-border bg-surface-2 text-xs font-bold text-muted">?</div>
  <div><p class="font-bold text-muted">Unranked</p><p class="text-sm text-muted">${msg}</p></div></div>`;
}
const SOLO = rankCard('솔로/듀오', ranked('emerald','에메랄드 2','54 LP',120,110,'52.2%'));
const FLEX = rankCard('자유랭크', ranked('gold','골드 1','10 LP',8,9,'47.1%'));
const FLEX_NONE = rankCard('자유랭크', unranked('이번 시즌 기록 없음'));
const FLEX_MASTER = rankCard('자유랭크', ranked('master','마스터','231 LP',60,41,'59.4%'));

/* ───── 매치 영역(자리표시) ───── */
function matches(m){
  const row = `<div class="h-[${m?'110':'133'}px] rounded-lg border-l-4 border-win/70 bg-surface-2/60 border border-border"></div>`;
  return `<div class="space-y-2"><div class="h-[${m?'207':'180'}px] rounded-lg border border-border bg-surface/60 flex items-center justify-center text-xs text-muted">최근 20게임 요약 (변경 없음)</div>${row}${row}</div>`;
}
function page(m, hdr, prof, ranks){
  return `<div class="space-y-${m?4:6}">${hdr}<div class="${m?'px-4':'px-6'} pb-6 space-y-6">${prof}
    <div class="${m?'space-y-4':'grid grid-cols-[280px_1fr] gap-6 items-start'}"><div class="space-y-3">${ranks}</div>${matches(m)}</div></div></div>`;
}
function frame(title, w, inner, note){
  return `<div><p class="mb-2 text-sm"><b>${title}</b> <span class="text-muted">${note||''}</span></p><div class="frame" style="width:${w}px">${inner}</div></div>`;
}

document.getElementById('d-before').innerHTML = frame('변경 전 (현재)', 1280,
  page(false, siteHeaderBefore(false), profileBefore(false), SOLO), '검색창 320x34, 헤더 56, 프로필 줄 1104x106 실측');
document.getElementById('d-after').innerHTML = frame('변경 후', 1280,
  page(false, siteHeaderAfter(false), profileAfter(false), SOLO+FLEX), '검색창 최대 560x44, 헤더 64, 티어·갱신하기 추가, 왼쪽 열에 자유랭크');
document.getElementById('m-before').innerHTML = frame('변경 전', 360,
  page(true, siteHeaderBefore(true), profileBefore(true), SOLO));
document.getElementById('m-after').innerHTML = frame('변경 후', 360,
  page(true, siteHeaderAfter(true), profileAfter(true), SOLO+FLEX), '헤더 2줄(검색창 전체 너비, 높이 44)');

const st = (t,s)=>`<div class="w-[640px]"><p class="mb-2 text-sm font-semibold">${t}</p>${profileAfter(false,s)}</div>`;
document.getElementById('states').innerHTML =
  st('기본 (누를 수 있음)','idle') + st('갱신 중 (서버 응답 대기, 버튼 잠김)','loading') + st('쿨다운 (60초 동안 잠김)','cool');

const rk = (t,b)=>`<div class="w-[280px] space-y-3"><p class="text-sm font-semibold">${t}</p>${b}</div>`;
document.getElementById('ranks').innerHTML =
  rk('솔로 + 자유 모두 있음', SOLO+FLEX) +
  rk('자유랭크 미배치/기록 없음 (leagues에 항목 없음)', SOLO+FLEX_NONE) +
  rk('솔로 없음 + 자유 있음', rankCard('솔로/듀오', unranked('이번 시즌 기록 없음'))+FLEX) +
  rk('마스터 이상은 단계 없음', SOLO+FLEX_MASTER) +
  rk('둘 다 없음', rankCard('솔로/듀오', unranked('이번 시즌 기록 없음'))+FLEX_NONE);
</script>
</body>
</html>
